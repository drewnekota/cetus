name: Release (compatibility entrypoint)

# Kept so existing bookmarks and manual runbooks still work. It rebuilds only
# Windows, then safely merges that updater into the same-version release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to create or replace
        required: true
        default: release

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ inputs.tag }}
      platform: windows
      publish: true
    secrets: inherit
