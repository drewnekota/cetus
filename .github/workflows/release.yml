name: Release (macOS + Windows)

# Releases macOS by default. Windows is built only when explicitly selected.
# The Windows-only compatibility workflow still merges into an existing
# same-version manifest, while a macOS-only publish replaces the release with
# macOS assets and a macOS-only updater manifest.
#
# Required repository secrets:
#
# macOS signing + notarization:
#   APPLE_CERTIFICATE
#   APPLE_CERTIFICATE_PASSWORD
#   APPLE_SIGNING_IDENTITY
#   APPLE_ID
#   APPLE_PASSWORD
#   APPLE_TEAM_ID
#   KEYCHAIN_PASSWORD
#
# Tauri updater signing (shared by macOS and Windows):
#   TAURI_SIGNING_PRIVATE_KEY
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to create or replace
        required: true
        default: release
      platform:
        description: Platforms to build
        required: true
        type: choice
        options:
          - macos
          - both
          - windows
        default: macos
      publish:
        description: Publish to GitHub Release (otherwise keep Actions artifacts only)
        required: true
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag:
        description: GitHub release tag to create or replace
        required: true
        type: string
      platform:
        description: Platforms to build
        required: false
        type: string
        default: macos
      publish:
        description: Publish to GitHub Release
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  version-check:
    name: Validate release version
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_PLATFORM: ${{ inputs.platform || 'both' }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify source versions match
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAURI_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [[ "$PACKAGE_VERSION" != "$TAURI_VERSION" ]]; then
            echo "package.json ($PACKAGE_VERSION) and tauri.conf.json ($TAURI_VERSION) versions differ" >&2
            exit 1
          fi
          if [[ ! "$TAURI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must use numeric major.minor.patch format: $TAURI_VERSION" >&2
            exit 1
          fi

      - name: Require an appropriate published-version change
        if: github.event_name == 'push' || inputs.publish
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          PUBLISHED_MANIFEST="$RUNNER_TEMP/published-latest.json"
          HTTP_STATUS="$(curl --location --silent --show-error \
            --output "$PUBLISHED_MANIFEST" \
            --write-out '%{http_code}' \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/latest.json?version-check=${GITHUB_RUN_ID}")"

          if [[ "$HTTP_STATUS" == "404" ]]; then
            echo "No published updater manifest exists for $RELEASE_TAG; allowing the first release."
            exit 0
          fi
          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "Could not read the published updater manifest (HTTP $HTTP_STATUS)" >&2
            exit 1
          fi

          PUBLISHED_VERSION="$(node -p "require(process.argv[1]).version" "$PUBLISHED_MANIFEST")"
          node - "$CURRENT_VERSION" "$PUBLISHED_VERSION" "$RELEASE_PLATFORM" <<'NODE'
          const [current, published, platform] = process.argv.slice(2);
          const parse = (version) => {
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              throw new Error(`invalid release version: ${version}`);
            }
            return version.split(".").map(Number);
          };
          const compare = (left, right) => {
            const a = parse(left);
            const b = parse(right);
            for (let index = 0; index < 3; index += 1) {
              if (a[index] !== b[index]) return a[index] - b[index];
            }
            return 0;
          };

          const difference = compare(current, published);
          if (platform === "windows") {
            if (difference !== 0) {
              throw new Error(
                `Windows-only publishing must use the existing release version ${published}; got ${current}`,
              );
            }
            console.log(`Windows-only release version matches ${published}.`);
          } else {
            if (difference <= 0) {
              throw new Error(
                `Version must be bumped above published version ${published}; got ${current}`,
              );
            }
            console.log(`Release version increased from ${published} to ${current}.`);
          }
          NODE

  macos:
    name: Build macOS arm64
    needs: version-check
    if: github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'macos'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build pi sidecar tree
        run: scripts/build-pi-sidecar.sh

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/cetus-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build app bundle
        run: pnpm tauri build --bundles app

      - name: Sign, notarize, and staple app bundle
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)"
          scripts/macos-sign.sh "$APP" --notarize

      - name: Package, sign, and notarize DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)"
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          DMG="$RUNNER_TEMP/Cetus_${VERSION}_aarch64.dmg"
          scripts/package-dmg.sh "$APP" "$DMG"
          scripts/macos-sign.sh "$DMG" --notarize
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Package and sign macOS updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APP="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)"
          UPDATER="$RUNNER_TEMP/Cetus.app.tar.gz"
          tar -C "$(dirname "$APP")" -czf "$UPDATER" "$(basename "$APP")"
          pnpm tauri signer sign \
            -k "$TAURI_SIGNING_PRIVATE_KEY" \
            -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$UPDATER"
          test -s "$UPDATER"
          test -s "$UPDATER.sig"
          echo "MAC_UPDATER=$UPDATER" >> "$GITHUB_ENV"

      - name: Stage macOS release assets
        run: |
          set -euo pipefail
          mkdir release-assets
          cp "$DMG" release-assets/
          cp "$MAC_UPDATER" "$MAC_UPDATER.sig" release-assets/

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: cetus-release-macos
          path: release-assets/*
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Build Windows x64
    needs: version-check
    if: inputs.platform == 'both' || inputs.platform == 'windows'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build pi sidecar tree
        shell: bash
        run: scripts/build-pi-sidecar.sh

      - name: Build and sign NSIS installer + updater
        # PowerShell strips the quotes out of the inline JSON, so run this in
        # bash — tauri rejects `{bundle:{...}}` as invalid JSON.
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          pnpm tauri build --bundles nsis
          --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Stage Windows release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          INSTALLER="$(find src-tauri/target/release/bundle/nsis -maxdepth 1 -name '*-setup.exe' | head -1)"
          test -n "$INSTALLER"
          test -s "$INSTALLER"
          test -s "$INSTALLER.sig"
          mkdir release-assets
          cp "$INSTALLER" "release-assets/Cetus_${VERSION}_x64-setup.exe"
          cp "$INSTALLER.sig" "release-assets/Cetus_${VERSION}_x64-setup.exe.sig"

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: cetus-release-windows
          path: release-assets/*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish updater release
    needs: [macos, windows]
    if: >-
      always() &&
      !cancelled() &&
      (github.event_name == 'push' || inputs.publish) &&
      needs.macos.result != 'failure' &&
      needs.windows.result != 'failure' &&
      (needs.macos.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Download signed release assets
        uses: actions/download-artifact@v4
        with:
          pattern: cetus-release-*
          path: release-assets
          merge-multiple: true

      - name: Build or merge updater manifest
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          WINDOWS_ASSET="Cetus_${VERSION}_x64-setup.exe"
          MAC_BUILT=false
          WINDOWS_BUILT=false
          test ! -s "release-assets/Cetus.app.tar.gz" || MAC_BUILT=true
          test ! -s "release-assets/$WINDOWS_ASSET" || WINDOWS_BUILT=true

          if [[ "$MAC_BUILT" == true && "$WINDOWS_BUILT" == true ]]; then
            test -s "release-assets/Cetus.app.tar.gz.sig"
            test -s "release-assets/$WINDOWS_ASSET.sig"
            node scripts/updater-manifest.mjs create \
              --output release-assets/latest.json \
              --version "$VERSION" \
              --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --mac-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Cetus.app.tar.gz" \
              --mac-signature-file release-assets/Cetus.app.tar.gz.sig \
              --windows-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${WINDOWS_ASSET}" \
              --windows-signature-file "release-assets/$WINDOWS_ASSET.sig"
            echo "PUBLISH_MODE=replace" >> "$GITHUB_ENV"
          elif [[ "$MAC_BUILT" == true ]]; then
            test -s "release-assets/Cetus.app.tar.gz.sig"
            node scripts/updater-manifest.mjs create-platform \
              --output release-assets/latest.json \
              --version "$VERSION" \
              --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --platform darwin-aarch64 \
              --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Cetus.app.tar.gz" \
              --signature-file release-assets/Cetus.app.tar.gz.sig
            echo "PUBLISH_MODE=replace" >> "$GITHUB_ENV"
          else
            EXISTING="$RUNNER_TEMP/existing-latest.json"
            curl --fail --location --retry 3 --retry-all-errors \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/latest.json?run=${GITHUB_RUN_ID}" \
              --output "$EXISTING"

            if [[ "$WINDOWS_BUILT" == true ]]; then
              test -s "release-assets/$WINDOWS_ASSET.sig"
              node scripts/updater-manifest.mjs merge \
                --manifest "$EXISTING" \
                --output release-assets/latest.json \
                --version "$VERSION" \
                --platform windows-x86_64 \
                --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${WINDOWS_ASSET}" \
                --signature-file "release-assets/$WINDOWS_ASSET.sig"
            else
              echo "No platform release assets were downloaded" >&2
              exit 1
            fi
            echo "PUBLISH_MODE=merge" >> "$GITHUB_ENV"
          fi

          node scripts/updater-manifest.mjs verify \
            --manifest release-assets/latest.json \
            --version "$VERSION"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_MODE" == replace ]]; then
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release delete "$RELEASE_TAG" --yes
            fi
            gh release create "$RELEASE_TAG" \
              release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --latest
          else
            gh release view "$RELEASE_TAG" >/dev/null
            gh release upload "$RELEASE_TAG" \
              release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          fi

      - name: Verify published updater endpoints
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          PUBLISHED="$RUNNER_TEMP/latest.json"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/latest.json?run=${GITHUB_RUN_ID}" \
            --output "$PUBLISHED"
          node scripts/updater-manifest.mjs verify \
            --manifest "$PUBLISHED" \
            --version "$VERSION"
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            for (const [platform, entry] of Object.entries(manifest.platforms)) {
              process.stdout.write(`${platform}: ${entry.url}\n`);
            }
          ' "$PUBLISHED"
