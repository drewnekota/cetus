name: Release (macOS)

# Builds, signs, notarizes and publishes the macOS (Apple Silicon) app. Cetus
# ships for macOS only; the release version comes from package.json.
# The updater feed keeps the Tauri updater format (latest.json + a
# minisign-signed Cetus.app.tar.gz), so the last Tauri builds (<= 0.4.18)
# update straight into the Electron app.
#
# Required repository secrets:
#
# macOS signing + notarization:
#   APPLE_CERTIFICATE
#   APPLE_CERTIFICATE_PASSWORD
#   APPLE_SIGNING_IDENTITY
#   APPLE_ID
#   APPLE_PASSWORD
#   APPLE_TEAM_ID
#   KEYCHAIN_PASSWORD
#
# Updater signing (minisign key; the names date from the Tauri builds):
#   TAURI_SIGNING_PRIVATE_KEY
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD

on:
  push:
    tags: ["v*", "release"]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to create or replace
        required: true
        default: release
      publish:
        description: Publish to GitHub Release (otherwise keep Actions artifacts only)
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  version-check:
    name: Validate release version
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify the release version format
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must use numeric major.minor.patch format: $VERSION" >&2
            exit 1
          fi

      - name: Require an appropriate published-version change
        if: github.event_name == 'push' || inputs.publish
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED_MANIFEST="$RUNNER_TEMP/published-latest.json"
          HTTP_STATUS="$(curl --location --silent --show-error \
            --output "$PUBLISHED_MANIFEST" \
            --write-out '%{http_code}' \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/latest.json?version-check=${GITHUB_RUN_ID}")"

          if [[ "$HTTP_STATUS" == "404" ]]; then
            echo "No published updater manifest exists for $RELEASE_TAG; allowing the first release."
            exit 0
          fi
          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "Could not read the published updater manifest (HTTP $HTTP_STATUS)" >&2
            exit 1
          fi

          PUBLISHED_VERSION="$(node -p "require(process.argv[1]).version" "$PUBLISHED_MANIFEST")"
          node - "$CURRENT_VERSION" "$PUBLISHED_VERSION" <<'NODE'
          const [current, published] = process.argv.slice(2);
          const parse = (version) => {
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              throw new Error(`invalid release version: ${version}`);
            }
            return version.split(".").map(Number);
          };
          const compare = (left, right) => {
            const a = parse(left);
            const b = parse(right);
            for (let index = 0; index < 3; index += 1) {
              if (a[index] !== b[index]) return a[index] - b[index];
            }
            return 0;
          };

          if (compare(current, published) <= 0) {
            throw new Error(
              `Version must be bumped above published version ${published}; got ${current}`,
            );
          }
          console.log(`Release version increased from ${published} to ${current}.`);
          NODE

  macos:
    name: Build macOS arm64
    needs: version-check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: backend
          # Read-only reuse of the cache ci.yml warms on main. Actions caches
          # are ref-scoped, so a cache saved here (under `refs/tags/vX`) could
          # never be read by the next tag — saving it just costs ~44s per run.
          # `shared-key` must stay identical to the ci.yml `release-cache` job:
          # rust-cache otherwise folds the differing job ids into the key.
          shared-key: release-macos-arm64
          save-if: false

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build pi sidecar tree
        run: scripts/build-pi-sidecar.sh

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/cetus-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build app bundle
        run: |
          set -euo pipefail
          APP="$(node scripts/package-electron.mjs | tail -1)"
          test -d "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      # One Apple round-trip, not two. The notary service notarizes everything
      # inside a submitted container, so submitting the dmg covers the .app it
      # carries: the dmg gets stapled directly and the .app's ticket is then
      # fetched by cdhash (`--staple-only`) for the updater tarball. Notarizing
      # the .app first and the dmg second meant waiting on Apple twice, ~1m40s
      # of it redundant.
      - name: Sign and harden app bundle
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          scripts/macos-sign.sh "$APP" --harden

      - name: Package, sign, and notarize DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          DMG="$RUNNER_TEMP/Cetus_${VERSION}_aarch64.dmg"
          scripts/package-dmg.sh "$APP" "$DMG"
          scripts/macos-sign.sh "$DMG" --notarize
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Staple the app bundle
        run: |
          set -euo pipefail
          scripts/macos-sign.sh "$APP" --staple-only

      - name: Package and sign macOS updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          UPDATER="$RUNNER_TEMP/Cetus.app.tar.gz"
          tar -C "$(dirname "$APP")" -czf "$UPDATER" "$(basename "$APP")"
          pnpm dlx @tauri-apps/cli@2 signer sign \
            -k "$TAURI_SIGNING_PRIVATE_KEY" \
            -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$UPDATER"
          test -s "$UPDATER"
          test -s "$UPDATER.sig"
          echo "MAC_UPDATER=$UPDATER" >> "$GITHUB_ENV"

      - name: Stage macOS release assets
        run: |
          set -euo pipefail
          mkdir release-assets
          cp "$DMG" release-assets/
          # Stable name so README and cetus.run can link
          # releases/latest/download/Cetus.dmg without knowing the version.
          cp "$DMG" release-assets/Cetus.dmg
          cp "$MAC_UPDATER" "$MAC_UPDATER.sig" release-assets/

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: cetus-release-macos
          path: release-assets/*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish updater release
    needs: macos
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Download signed release assets
        uses: actions/download-artifact@v4
        with:
          name: cetus-release-macos
          path: release-assets

      - name: Build updater manifest
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test -s release-assets/Cetus.app.tar.gz
          test -s release-assets/Cetus.app.tar.gz.sig
          node scripts/updater-manifest.mjs create \
            --output release-assets/latest.json \
            --version "$VERSION" \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --mac-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Cetus.app.tar.gz" \
            --mac-signature-file release-assets/Cetus.app.tar.gz.sig
          node scripts/updater-manifest.mjs verify \
            --manifest release-assets/latest.json \
            --version "$VERSION"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Replaces the whole release: every asset on the old one (including
          # any Windows installer left from the Tauri era) is dropped.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --yes
          fi
          VERSION="$(node -p "require('./package.json').version")"
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## Download

          | Build | File | Requires |
          | --- | --- | --- |
          | **Cetus** ${VERSION} | [Cetus.dmg](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Cetus.dmg) | Apple Silicon, macOS 13+ |

          Cetus updates itself.

          NOTES
          gh release create "$RELEASE_TAG" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cetus ${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            --latest

      - name: Verify published updater endpoints
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED="$RUNNER_TEMP/latest.json"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/latest.json?run=${GITHUB_RUN_ID}" \
            --output "$PUBLISHED"
          node scripts/updater-manifest.mjs verify \
            --manifest "$PUBLISHED" \
            --version "$VERSION"
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            for (const [platform, entry] of Object.entries(manifest.platforms)) {
              process.stdout.write(`${platform}: ${entry.url}\n`);
            }
          ' "$PUBLISHED"
