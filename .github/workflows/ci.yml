name: CI

# Runs on every push to main and every pull request. Release builds are handled
# separately by release.yml (tagged pushes / manual dispatch), so this stays
# fast: typecheck + frontend export on Linux, and fmt/check/test on macOS
# (the app's primary target, matching release.yml).

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm lint

      - name: Build static export
        run: pnpm build

  rust:
    name: Rust · fmt + clippy + check + test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            backend
            backend/host
            backend/cli

      # backend/ (the app addon), backend/host (the Electron host runtime the
      # backend is written against) and backend/cli (the `cetus` CLI) are
      # separate crates, each with its own lockfile and target dir.
      - name: Format check
        run: |
          for crate in backend backend/host backend/cli; do
            (cd "$crate" && cargo fmt --check)
          done

      - name: Clippy (warnings are errors)
        run: |
          for crate in backend backend/host backend/cli; do
            (cd "$crate" && cargo clippy --all-targets -- -D warnings)
          done

      - name: Compile check
        working-directory: backend
        run: cargo check

      - name: Run tests
        run: |
          for crate in backend backend/host backend/cli; do
            (cd "$crate" && cargo test)
          done

  release-cache:
    name: Rust · warm release cache
    # Primes the `--release` dependency artifacts that release.yml reuses.
    # Actions caches are ref-scoped: a cache written by `refs/tags/vX` is only
    # readable by that same tag, so every tagged release used to compile the
    # whole dependency tree from scratch (~9m44s in v0.3.92). Caches on the
    # default branch, though, are readable from every ref — so main writes the
    # cache here and release.yml only reads it (`save-if: false`).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: backend
          # rust-cache folds the job id into the key unless `shared-key` is set,
          # so this must stay identical to the value in release.yml.
          shared-key: release-macos-arm64

      - name: Build release dependencies
        working-directory: backend
        run: cargo build --release
