name: CI

# Runs on every push to main and every pull request. Release builds are handled
# separately by release.yml (tagged pushes / manual dispatch), so this stays
# fast: typecheck + frontend export on Linux, and fmt/check/test on macOS
# (the app's primary target, matching release.yml).

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm lint

      - name: Build static export
        run: pnpm build

  rust:
    name: Rust · fmt + clippy + check + test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stub frontend + pi-install resource paths
        # tauri-build validates that the bundled `pi-install` resource path and
        # the `frontendDist` (`../out`) directory exist at build-script / macro
        # time, but their content only matters when bundling — release.yml
        # builds the real frontend (`pnpm build`) and pi tree
        # (scripts/build-pi-sidecar.sh, needs Bun) there. Empty dirs keep
        # check/clippy/test green on a fresh checkout without those builds.
        run: |
          mkdir -p out
          mkdir -p src-tauri/pi-install

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Compile check
        working-directory: src-tauri
        run: cargo check

      - name: Run tests
        working-directory: src-tauri
        run: cargo test

  release-cache:
    name: Rust · warm release cache
    # Primes the `--release` dependency artifacts that release.yml reuses.
    # Actions caches are ref-scoped: a cache written by `refs/tags/vX` is only
    # readable by that same tag, so every tagged release used to compile the
    # whole dependency tree from scratch (~9m44s in v0.3.92). Caches on the
    # default branch, though, are readable from every ref — so main writes the
    # cache here and release.yml only reads it (`save-if: false`).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # rust-cache folds the job id into the key unless `shared-key` is set,
          # so this must stay identical to the value in release.yml.
          shared-key: release-macos-arm64

      - name: Stub frontend + pi-install resource paths
        # Same reason as the `rust` job above: tauri-build only checks that the
        # paths exist. The stub bundle this produces is thrown away — only the
        # cached dependency artifacts matter.
        run: |
          mkdir -p out
          mkdir -p src-tauri/pi-install

      - name: Build release dependencies
        working-directory: src-tauri
        run: cargo build --release
