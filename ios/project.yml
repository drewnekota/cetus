# xcodegen spec for the Cetus iOS app. `xcodegen generate` writes
# CetusMobile.xcodeproj (git-ignored); the shared code lives in the
# CetusRemoteKit package next to this file.
name: CetusMobile
options:
  bundleIdPrefix: dev.cetus
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  CetusRemoteKit:
    path: CetusRemoteKit
settings:
  base:
    DEVELOPMENT_TEAM: 65N4VF5643
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Cetus:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: CetusRemoteKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cetus.mobile
        PRODUCT_NAME: Cetus
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cetus
        INFOPLIST_KEY_NSCameraUsageDescription: Cetus uses the camera to scan the pairing QR code shown on your Mac.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Attach photos to messages you send to your agents.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: dev.cetus.mobile.pair
            CFBundleURLSchemes: [cetus]
