[package]
name = "cetus"
version = "0.1.0"
description = "The desktop assistant layer for Codex, Claude Code, and your favorite agent runtime."
authors = ["Cetus"]
edition = "2021"
rust-version = "1.77"

# The backend ships as a Node-API addon loaded by the Electron main process
# (see `src/electron.rs` and `electron/`). The `cetus` CLI is its own crate
# under `cli/` so it stays a small, instant binary.
autobins = false

[lib]
name = "cetus_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
napi-build = "2"

[dependencies]
cetus-bridge = { path = "cetus-bridge" }
# The Electron host runtime (AppHandle, State, Emitter, windows, plugins),
# implemented on top of the Electron main process.
host = { path = "host", package = "cetus-host" }
napi = { version = "2", default-features = false, features = ["napi6"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "io-util", "process", "time", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["clock"] }
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
keyring = { version = "3", features = ["apple-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
base64 = "0.22"
# Doubao (Volcano Engine) real-time streaming ASR: a binary WebSocket protocol
# with gzip'd frames. tokio-tungstenite for the wss session, flate2 for the
# gzip payloads, futures-util for the split read/write sink+stream.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
flate2 = "1"
futures-util = "0.3"
axum = { version = "0.7", features = ["ws"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Chinese word segmentation + POS tagging for recognition biasing: we mine
# distinctive proper nouns (人名/地名/机构/专名) out of memory + past transcripts
# to boost as hotwords. zh has no spaces, so a segmenter is required to pull
# terms — the ASCII path can't. Dict loads once, lazily (off by default).
jieba-rs = "0.7"
# Screen-context collection (Rewind-like): periodic screenshot + on-device OCR.
# xcap grabs monitor frames cross-platform; image handles resize/JPEG encode.
# We decouple from xcap's bundled image version by lifting the raw RGBA bytes
# out and rebuilding an image::RgbaImage with our own crate, so a version skew
# never breaks type unification.
xcap = "0.4"
image = "0.25"
ignore = "0.4"
tracing-appender = "0.2.5"
sysinfo = "0.33"
# Workspace Terminal tabs are real, long-lived pseudo terminals.  This keeps
# interactive programs (codex, claude, vim, dev servers) attached to a TTY and
# lets the frontend resize/write the same shell process across commands.
portable-pty = "0.9"

# macOS-only: the global "double / both ⌘" launcher gesture is detected with a
# CGEventTap (the OS hotkey API can't register modifier-only chords), and the
# quick panel gets NSVisualEffectView vibrancy.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
# Read the focused app's text field (Accessibility API) for dictation context
# biasing — best-effort, gated on the Accessibility trust we already require.
accessibility-sys = "0.2"
# Turn the launcher window into a non-activating NSPanel (Spotlight/Raycast
# behavior: takes key focus without activating the app, rides onto any Space).
# `exception` feature: lets us KVC-set NSWindow's private
# `windowOcclusionDetectionEnabled` flag (see panel::disable_occlusion_throttling)
# under an Obj-C @try guard, so an unsupported key logs instead of aborting.
objc2 = { version = "0.6", features = ["exception"] }
# Objective-C blocks (paired with objc2 0.6) — used for the global NSEvent
# mouse-down monitor that dismisses the launcher on an outside click.
block2 = "0.6"
# Native Artifact thumbnails. Quick Look understands the same common media
# formats as Finder, so video cards get a representative frame without making
# the webview download/decode the full file first.
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-uniform-type-identifiers = "0.3"
objc2-quick-look-thumbnailing = { version = "0.3", default-features = false, features = [
  "std",
  "QLThumbnailGenerationRequest",
  "QLThumbnailGenerator",
  "QLThumbnailRepresentation",
  "block2",
  "objc2-core-foundation",
  "objc2-uniform-type-identifiers",
] }
# Used to kill the disclaim-shim's whole process group when a dictation is
# cancelled (the helper it spawns is disclaimed into the same group).
libc = "0.2"

[features]
default = []
# DEV-ONLY in-app eval/debug bridge. NEVER add to `default`; compiled out of release.
devtest = []

# The screen-context loop pushes every captured Retina frame through `image`
# (resize + JPEG encode). Unoptimized, that costs ~3s of a full core per 8s
# tick in a debug build (`pnpm app`) — a constant fan-spin / battery drain.
# Keep the pixel crate optimized even in dev builds; everything else stays
# fast-compile.
[profile.dev.package.image]
opt-level = 3
